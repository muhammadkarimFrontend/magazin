<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>magazin</title>
		<link rel="stylesheet" href="css/steyles.css" />
	</head>
	<body>
		<header class="site-header">
			<div class="container site-header__container">
				<a class="logo__link" href="#">
					<img src="images/header/image 1.svg" alt="logo" />
					<h2 class="site-header__title">1С-Товары</h2>
				</a>

				<ul class="site-header__list">
					<li class="site-header__item">
						<a class="site-header__link" href="#">Как это работает</a>
					</li>

					<li class="site-header__item">
						<a class="site-header__link" href="#">Инструкции</a>
					</li>

					<li class="site-header__item">
						<a class="site-header__link" href="#">Продукты</a>
					</li>

					<li class="site-header__item">

					<li class="site-header__item">
						<a class="site-header__link" href="#">О нас</a>
					</li>
				</ul>
				<button class="btn">Вход</button>
			</div>

			<div class="container hero__container">
				<div class="hero__info">
					<h2 class="hero__title">
						Управление запасами <br />

					<p class="hero__text">
						Использование сервиса 1С-Товары позволяет <br />
						упростить работу по формированию заявок
					</p>
					<button class="btn3">Заказать демонстрацию</button>
				</div>
				<div class="hero__img">
					<img src="images/hero/Grocery.svg" alt="Grocery" width="508" height="451" />
				</div>
			</div>
		</section>
